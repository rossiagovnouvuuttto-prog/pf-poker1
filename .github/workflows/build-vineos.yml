name: Build VineOS APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-vineos.yml"
      - "overrides/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout our patches
        uses: actions/checkout@v4

      - name: Checkout pinned original VineOS source
        uses: actions/checkout@v4
        with:
          repository: Hexadecinull/VineOS
          ref: e2b1f47dea86969579b6469f74fad2d0b36edad2
          path: upstream
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37.1" "cmake;3.22.1"


      - name: Apply Android 9 image provisioning patch
        run: python3 scripts/patch-upstream.py --project upstream

      - name: Add VM boot status diagnostics
        run: python3 scripts/patch-boot-status.py --project upstream

      - name: Build signed debug APK
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee ../build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VineOS-debug-APK
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish test APK for download without GitHub login
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp upstream/app/build/outputs/apk/debug/app-debug.apk VineOS-Diagnostics2-Android16-test.apk
          cat > release-notes.md <<'EOF'
          VineOS experimental Android 16 / HyperOS 3 foreground-service fix.

          - Fixes ForegroundServiceDidNotStartInTimeException candidate by promoting
            VineService in onCreate and waiting for the service before native boot.
          - Installs as a separate app named "VineOS Diagnostics 2", preserving old
            VineOS app data and already imported ROMs.
          - Import the original .vrom again from Downloads into this separate app.
          - This APK is NOT a boot-tested Android 9 VM; guest ROOT and GPU
            support are not implemented. Further native startup errors are possible.
          EOF
          gh release create "vineos-fgsfix-${GITHUB_RUN_NUMBER}" \
            VineOS-Diagnostics2-Android16-test.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "VineOS Diagnostics: Android 9 black screen (test)" \
            --notes-file release-notes.md \
            --prerelease

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VineOS-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
