name: Rootless ARM64 QEMU smoke test (Linux only)

on:
  push:
    branches: [main]
    paths:
      - "rootless-qemu/**"
      - ".github/workflows/rootless-qemu-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu-tcg:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU system ARM64 without relying on host KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm
          command -v qemu-system-aarch64
      - name: Boot real ARM64 Linux kernel using QEMU TCG
        run: bash rootless-qemu/smoke-test.sh
      - name: Upload serial console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rootless-arm64-linux-serial
          path: rootless-qemu/out/serial.log
          if-no-files-found: ignore
          retention-days: 14
