name: Build Android ARM64 QEMU with VNC framebuffer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-qemu-arm64-vnc.yml"
      - "scripts/enable-vnc-podroid.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu-arm64-vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout VineOS QEMU source patch
        uses: actions/checkout@v4
      - name: Checkout pinned Podroid Android ARM64 QEMU source and GPL recipe
        uses: actions/checkout@v4
        with:
          repository: ExTV/Podroid
          ref: ce0121896b2895637ab1f656cbb0d75fa2874489
          path: podroid
          persist-credentials: false
      - name: Enable VNC in QEMU cross-build recipe
        run: bash scripts/enable-vnc-podroid.sh podroid
      - name: Build QEMU 11.0.4 Android ARM64 with VNC server
        shell: bash
        run: |
          set -euo pipefail
          docker build --target qemu-builder \
            --build-arg QEMU_VERSION=11.0.4 \
            -t vineos-android-arm64-vnc \
            -f podroid/Dockerfile podroid
          cid="$(docker create vineos-android-arm64-vnc)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p qemu-vnc
          docker cp "$cid:/opt/qemu-out/libqemu-system-aarch64.so" \
             qemu-vnc/libqemu-system-aarch64.so
          docker cp "$cid:/opt/qemu-out/libslirp.so" \
             qemu-vnc/libslirp.so || true
          # Dependency libslirp, if present, must accompany QEMU on Android.
          file qemu-vnc/libqemu-system-aarch64.so
          readelf -h qemu-vnc/libqemu-system-aarch64.so | head -25
          readelf -d qemu-vnc/libqemu-system-aarch64.so | grep NEEDED || true
          strings qemu-vnc/libqemu-system-aarch64.so | grep -m 4 -E 'vnc://|vnc_init|VNC server running|VNC server failed' || true
          test "$(stat -c %s qemu-vnc/libqemu-system-aarch64.so)" -gt 3000000
          sha256sum qemu-vnc/*.so
      - name: Boot real ARM64 QEMU executable as Android guest process (smoke)
        shell: bash
        run: |
          set -euo pipefail
          # Android ARM64 binary cannot run natively on the x86_64 CI host.
          # ELF checks and QEMU VNC backend source build are verified above.
          # Device-level display, keyboard and Android9 desktop tests are
          # separate and must not be marked passing by this step alone.
          echo "Android ARM64 QEMU VNC binary built; guest runtime validation still required."
      - name: Upload Android ARM64 VNC-enabled QEMU binary
        uses: actions/upload-artifact@v4
        with:
          name: vineos-qemu-arm64-vnc-gpl-binaries
          path: qemu-vnc/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
